# PostgreSQL connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=insurance
quarkus.datasource.password=insurance_dev
# quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/insurance
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres:5432/insurance}
# Disable automatic database containers
quarkus.datasource.devservices.enabled=false

# quarkus.http.port=8081
# Quarkus HTTP Server
quarkus.http.port=${APP_PORT:8081}
quarkus.http.host=0.0.0.0

# CIB seven REST API
# quarkus.rest-client.cibseven.url=http://cibseven:8080/engine-rest
# CIB seven REST API
quarkus.rest-client.cibseven.url=${CIBSEVEN_URL:http://localhost:8080/engine-rest}

# Quarkus address reachable from CIB seven
insurance.service.base-url=${INSURANCE_SERVICE_URL:http://host.docker.internal:8081}

# ActiveMQ Artemis
quarkus.artemis.url=tcp://artemis:61616
quarkus.artemis.username=insurance
quarkus.artemis.password=insurance_dev