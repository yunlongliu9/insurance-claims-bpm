services:
  cibseven:
    image: cibseven/cibseven:2.2.0
    ports:
      - "8080:8080"
    environment:
      HISTORY_LEVEL: audit
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/insurance
      DB_USERNAME: insurance
      DB_PASSWORD: insurance_dev
    depends_on:
      - postgres
    volumes:
      - ./config/bpm-platform.xml:/camunda/conf/bpm-platform.xml:ro
  document-agent:
    build:
      context: ../insurance-document-agent
      dockerfile: Dockerfile
    env_file:
      - ../insurance-document-agent/.env
    ports:
      - "3002:3001"
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - maven-cache:/root/.m2

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  maven-cache:
  postgres-data: